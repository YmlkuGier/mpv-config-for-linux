# g-s                  script-binding select/select-secondary-sid   # 打开select分菜单：主字幕轨道列表
# g-S                  script-binding select/select-secondary-sid   # 打开select分菜单：次字幕轨道列表
# g-l                  script-binding select/select-subtitle-line   # 打开select分菜单：主字幕行列表
# g-L                  script-binding select/select-secondary-subtitle-line   # 打开select分菜单：次字幕行列表
# g-r                  script-binding select/show-properties        # 打开select分菜单：属性列表
#
# MBTN_MID             script-binding select/context-menu           # 唤起mpv上下文菜单（OSD版） [中键-单击]
#
