# Ctrl+WHEEL_UP        script-binding positioning/cursor-centric-zoom  0.1   # 放大画面（跟随光标）
# Ctrl+WHEEL_DOWN      script-binding positioning/cursor-centric-zoom -0.1   # 缩小画面（跟随光标）
