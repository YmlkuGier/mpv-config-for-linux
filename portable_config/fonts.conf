<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <description>Font configuration file mpv for Linux</description>
    <dir>/usr/share/fonts</dir>
    <dir>/usr/local/share/fonts</dir>
    <dir>~/.local/share/fonts</dir>
    <dir>~/.fonts</dir>
    <cachedir>~/.cache/fontconfig</cachedir>
    <include ignore_missing="yes">~/.auto_load_fonts.conf</include>
</fontconfig>
